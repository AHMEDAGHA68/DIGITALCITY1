
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول المسؤول | DIGITALCITY</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #071a33;
      padding: 20px;
    }

    .login-box {
      background: white;
      width: 100%;
      max-width: 400px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      text-align: center;
      color: #071a33;
      font-size: 25px;
    }

    p {
      text-align: center;
      color: #666;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #087ea4;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #05617e;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #087ea4;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>DIGITALCITY</h1>
    <p>تسجيل دخول المسؤول</p>

    <form action="/admin/login" method="POST">

      <label for="username">اسم المستخدم</label>
      <input
        type="text"
        id="username"
        name="username"
        required
        autocomplete="username"
      >

      <label for="password">كلمة المرور</label>
      <input
        type="password"
        id="password"
        name="password"
        required
        autocomplete="current-password"
      >

      <button type="submit">تسجيل الدخول</button>

    </form>

    <a class="back" href="index.html">العودة للموقع</a>
  </div>

</body>
</html>
